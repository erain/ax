# AX with FinOps on the ax-finops-poc cluster: deploy/ax-server.yaml +
# deploy/redis.yaml + the rate card, with the FinOps flags, OTLP ingest port
# and OTel env. Files outside this directory are referenced, so build with
#   kubectl kustomize --load-restrictor=LoadRestrictionsNone deploy/finops
# The ax-server image is still a ko:// reference; resolve it with ko
# (see the Makefile target deploy-finops).
#
# Task image: ax-server runs with --default-task-image set to the FinOps runner
# image (the built-in gcr.io default is not pullable from this cluster), so
# Tasks may omit spec.image:
#   us-central1-docker.pkg.dev/yiyu-gke-dev/ax-finops/ax-task-runner:finops-latest
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../ax-server.yaml
  # deploy/redis.yaml minus its Namespace (ax-server.yaml already has one, and
  # kustomize rejects duplicate resources).
  - redis
  # Lets the usage puller reach task runners through Substrate's worker policy.
  - networkpolicy.yaml

# Stable name (no hash suffix): editing deploy/ratecard.yaml and re-applying
# updates the ConfigMap in place, the kubelet refreshes the mounted directory
# and ax-server hot-reloads the file without a restart.
configMapGenerator:
  - name: ax-ratecard
    namespace: ax-system
    files:
      - ratecard.yaml=../ratecard.yaml
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: ax-server
        app.kubernetes.io/part-of: ax

patches:
  - path: ax-server-patch.yaml
  - path: service-patch.yaml
  # ax-server reaches api.ate-system:443 only from namespaces with this label
  # (it was set by hand in T00; keep it declarative so apply never drops it).
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: ax-system
        labels:
          ate.dev/api-access: "true"
