# Adds the OTLP/HTTP ingest port the sidecar collector exports ate.actor.*
# logs to (http://ax-server.ax-system.svc.cluster.local:4318/v1/logs).
apiVersion: v1
kind: Service
metadata:
  name: ax-server
  namespace: ax-system
spec:
  ports:
    - port: 4318
      targetPort: 4318
      protocol: TCP
      name: otlp-http
