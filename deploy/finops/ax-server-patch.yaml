# FinOps settings for ax-server. args replaces the whole list (strategic merge
# does not merge string lists), so the base flags are repeated here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ax-server
  namespace: ax-system
spec:
  template:
    spec:
      containers:
        - name: ax-server
          args:
            - "--addr=:8080"
            - "--redis-addr=ax-redis.ax-system.svc.cluster.local:6379"
            - "--substrate-endpoint=api.ate-system.svc.cluster.local:443"
            - "--substrate-authority=api.ate-system.svc"
            - "--substrate-token-file=/var/run/secrets/ateapi/token"
            - "--substrate-ca-file=/run/servicedns-ca/trust-bundle.pem"
            - "--template=default-template"
            - "--template-atespace=ax-system"
            # FinOps (T08)
            - "--otlp-addr=:4318"
            - "--rate-card=/etc/ax/ratecard.yaml"
            - "--usage-pull-interval=60s"
            - "--runner-port=80"
            # Substrate v0.5.0 workers do not expose actor ports on the pod IP;
            # pull runner usage through atenet-router (ate-target-actor header).
            - "--usage-router-addr=atenet-router.ate-system.svc.cluster.local:80"
            - "--summary-interval=10m"
            # JSON logs -> Cloud Logging jsonPayload (dashboard logs panel filters
            # jsonPayload.msg="ax.task.usage_summary").
            - "--log-format=json"
            # Tasks without spec.image use the FinOps runner image (the
            # built-in gcr.io default is not pullable from this cluster).
            # Substrate v0.5.0 only accepts digest-pinned images; this is
            # ax-task-runner:finops-latest (T14a build 361705f). Update it after
            # rebuilding the runner image.
            - "--default-task-image=us-central1-docker.pkg.dev/yiyu-gke-dev/ax-finops/ax-task-runner@sha256:020f5dc4a386ba87c46e81c4d8ea9958ecce02e7ffd656eba378572666f1e7f8"
          env:
            - name: AX_SNAPSHOTS_BUCKET
              value: "gs://ax-finops-snapshots-yiyu-gke-dev/ate-env/"
            # OTel metrics -> sidecar collector (OTLP/HTTP protobuf).
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.ax-system.svc.cluster.local:4318"
            - name: OTEL_SERVICE_NAME
              value: "ax-server"
            # Each counter series starts at its own creation time, so PromQL
            # increase() counts its first increment (ax-server also defaults
            # this to true).
            - name: OTEL_GO_X_PER_SERIES_START_TIMESTAMPS
              value: "true"
            # The managed collector sees the sidecar's IP, so ax-server names
            # its own pod in the resource (downward API). POD_* must come
            # before OTEL_RESOURCE_ATTRIBUTES for $(VAR) expansion.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.ip=$(POD_IP),k8s.deployment.name=ax-server,k8s.container.name=ax-server"
          ports:
            - containerPort: 4318
              name: otlp-http
              protocol: TCP
          volumeMounts:
            # Whole directory, not a subPath, so ConfigMap updates reach the
            # pod and --rate-card hot reload works.
            - mountPath: /etc/ax
              name: ratecard
              readOnly: true
      volumes:
        - name: ratecard
          configMap:
            name: ax-ratecard
            items:
              - key: ratecard.yaml
                path: ratecard.yaml
