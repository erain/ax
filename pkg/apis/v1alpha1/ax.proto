syntax = "proto3";

package ax.v1alpha1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/google/ax/pkg/apis/v1alpha1";

// AX defines the core control plane gRPC service for autonomous agent orchestration.
service AX {
  // Manifests are parsed by the client (see `ax apply`) and submitted through the
  // typed Update* RPCs below; the server never receives raw YAML.

  // Tasks
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  rpc SuspendTask(SuspendTaskRequest) returns (Task);
  rpc ResumeTask(ResumeTaskRequest) returns (Task);
  rpc WatchTask(WatchTaskRequest) returns (stream WatchTaskResponse);

  // Usage
  // ListUsage returns per-task, per-day (UTC) usage and cost records.
  rpc ListUsage(ListUsageRequest) returns (ListUsageResponse);


  // Workspaces
  rpc GetWorkspace(GetWorkspaceRequest) returns (Workspace);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (Workspace);
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);

  // Models
  rpc GetModel(GetModelRequest) returns (Model);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc UpdateModel(UpdateModelRequest) returns (Model);
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse);

}

// ObjectMeta is metadata for AX resources.
message ObjectMeta {
  string name = 1;
  string atespace = 2;
  google.protobuf.Timestamp creation_timestamp = 3;
  // labels are key/value pairs used to group and select resources, for example
  // for cost attribution (`agent`, `customer`). They follow Kubernetes label
  // syntax.
  map<string, string> labels = 4;
}

// --- Task ---

message Task {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  TaskSpec spec = 4;
  TaskStatus status = 5;
}

message TaskSpec {
  string image = 1;
  repeated string command = 2;
  repeated EnvVar env = 3;
  ResourceReqs resources = 4;
  // workspaces binds one or more Workspaces, each mounted at its own path
  // under /workspace. The first entry is the task command's working directory.
  repeated WorkspaceRef workspaces = 5;
  // debug enables the in-container guest services (process execution and file
  // access) that back `ax ssh`. Off by default.
  bool debug = 6;
  // budget sets soft limits on the task's resource and model usage.
  BudgetSpec budget = 7;
  // on_completion controls what happens once the task command exits.
  CompletionPolicy on_completion = 8;
}

// BudgetSpec sets soft limits on a task. Crossing warn_at_percent of any limit
// raises a BudgetWarning condition; reaching a limit raises BudgetExceeded.
message BudgetSpec {
  // active_deadline limits the time the task spends running.
  google.protobuf.Duration active_deadline = 1;
  // max_tokens limits the total model tokens of all kinds.
  int64 max_tokens = 2;
  // max_cost limits the total cost (compute + tokens + storage).
  Money max_cost = 3;
  // warn_at_percent is the percentage of a limit at which to warn. Zero uses
  // the server default.
  int32 warn_at_percent = 4;
  ExceededAction on_exceeded = 5;
}

message Money {
  string currency = 1;
  double amount = 2;
}

// ExceededAction is what happens when a budget limit is reached.
enum ExceededAction {
  EXCEEDED_ACTION_UNSPECIFIED = 0;
  // WARN only records the BudgetExceeded condition.
  WARN = 1;
  // SUSPEND suspends the task. Not supported yet.
  SUSPEND = 2;
}

// CompletionPolicy is what happens to a task once its command exits.
enum CompletionPolicy {
  COMPLETION_POLICY_UNSPECIFIED = 0;
  // KEEP leaves the task running.
  KEEP = 1;
  // SUSPEND_ON_EXIT suspends the task and marks it Completed.
  SUSPEND_ON_EXIT = 2;
}

message EnvVar {
  string name = 1;
  string value = 2;
}

message ResourceReqs {
  ResourceList requests = 1;
  ResourceList limits = 2;
}

message ResourceList {
  string cpu = 1;
  string memory = 2;
}

message WorkspaceRef {
  string name = 1;
  string path = 2;
  string goal = 3;
}

message TaskStatus {
  string phase = 1;
  string id = 2;
  string actor = 3;
  // json_name keeps the established `workerIP` spelling in YAML and JSON.
  string worker_ip = 4 [json_name = "workerIP"];
  // Fields 5 and 6 were pending_approval and an int32 token-count usage.
  reserved 5, 6;
  reserved "pending_approval";
  repeated Condition conditions = 7;
  // actor_uid is the Substrate actor UID backing the current actor.
  string actor_uid = 8;
  // usage is the task's lifetime resource usage and cost.
  UsageStatus usage = 9;
}

// UsageStatus is a task's accumulated resource usage and cost.
message UsageStatus {
  // active_duration is the time the task's actor spent running.
  google.protobuf.Duration active_duration = 1;
  double cpu_seconds = 2;
  double memory_gib_seconds = 3;
  // workspace_bytes is the latest reported size of the workspace.
  int64 workspace_bytes = 4;
  // idle_duration is the part of active_duration the task spent idle.
  google.protobuf.Duration idle_duration = 5;
  // tokens is per-model token usage, sorted by model.
  repeated ModelTokenUsage tokens = 6;
  CostBreakdown cost = 7;
  google.protobuf.Timestamp update_time = 8;
}

message ModelTokenUsage {
  string model = 1;
  int64 input = 2;
  int64 output = 3;
  int64 cache_read = 4;
  int64 cache_write = 5;
  int64 reasoning = 6;
}

// CostBreakdown splits a cost by kind. total = compute + tokens + storage;
// idle is the part of compute spent while idle, shown separately.
message CostBreakdown {
  string currency = 1;
  double total = 2;
  double compute = 3;
  double tokens = 4;
  double storage = 5;
  double idle = 6;
  // tokens_partially_unpriced is set when some tokens used a model missing
  // from the rate card and were not priced.
  bool tokens_partially_unpriced = 7;
}

message Condition {
  string type = 1;
  string status = 2;
  google.protobuf.Timestamp last_transition_time = 3;
  string reason = 4;
  string message = 5;
}

// --- Workspace ---

message Workspace {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  WorkspaceSpec spec = 4;
}

message WorkspaceSpec {
  repeated GitRepo git = 1;
  repeated File files = 2;
  MCPConfig mcp = 3;
  SkillsConfig skills = 4;
}

message GitRepo {
  string name = 1;
  string repo = 2;
  string branch = 3;
  string dir = 4;
  int32 depth = 5;
}

message File {
  string path = 1;
  string content = 2;
}

message MCPConfig {
  repeated MCPRegistry registries = 1;
  repeated MCPServer servers = 2;
}

message MCPRegistry {
  string provider = 1;
  string project = 2;
  string query = 3;
  repeated MCPServer servers = 4;
}

message MCPServer {
  string name = 1;
  string endpoint = 2;
  string command = 3;
  repeated string args = 4;
}

message SkillsConfig {
  repeated SkillRegistry registries = 1;
  string path = 2;
}

message SkillRegistry {
  string provider = 1;
  string project = 2;
  string query = 3;
}

// --- Model ---

message Model {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  ModelSpec spec = 4;
}

message ModelSpec {
  string provider = 1;
  string model = 2;
  // Fields 3-5 were typed temperature, max_tokens, and system_instruction;
  // provider settings now live in the free-form `parameters` map.
  reserved 3, 4, 5;
  reserved "temperature", "max_tokens", "system_instruction";
  SecretKeyRef secret_key = 6;
  // parameters are provider-specific generation settings passed through to the
  // model API as-is, for example temperature or maxOutputTokens for Gemini.
  google.protobuf.Struct parameters = 7;
}

message SecretKeyRef {
  string name = 1;
  string key = 2;
}

// --- RPC Request & Response Messages ---

// Tasks
message GetTaskRequest {
  string atespace = 1;
  string name = 2;
}

message ListTasksRequest {
  string atespace = 1;
  int64 limit = 2;
  int64 offset = 3;
  // label_selector filters tasks by labels: comma-separated `key=value`
  // equality terms, all of which must match. Empty selects all tasks.
  string label_selector = 4;
}

message ListTasksResponse {
  repeated Task tasks = 1;
}

message CreateTaskRequest {
  Task task = 1;
}

message DeleteTaskRequest {
  string atespace = 1;
  string name = 2;
}

message DeleteTaskResponse {}

message SuspendTaskRequest {
  string atespace = 1;
  string name = 2;
}

message ResumeTaskRequest {
  string atespace = 1;
  string name = 2;
}

message WatchTaskRequest {
  string atespace = 1;
  string name = 2;
}

message WatchTaskResponse {
  Task task = 1;
  string action = 2;
}

// Usage
message ListUsageRequest {
  string atespace = 1;
  // label_selector has the same syntax as ListTasksRequest.label_selector.
  string label_selector = 2;
  // start_date and end_date bound the UTC days returned, as YYYY-MM-DD,
  // inclusive. An empty end_date means today (UTC); an empty start_date
  // means 29 days before end_date, so the default is the last 30 days.
  string start_date = 3;
  string end_date = 4;
}

message ListUsageResponse {
  repeated DailyUsage days = 1;
}

// DailyUsage is one task's usage and cost on one UTC day.
message DailyUsage {
  string atespace = 1;
  string task = 2;
  string task_uid = 3;
  map<string, string> labels = 4;
  // date is the UTC day, as YYYY-MM-DD.
  string date = 5;
  double cpu_seconds = 6;
  double memory_gib_seconds = 7;
  double active_seconds = 8;
  double idle_seconds = 9;
  double storage_gib_seconds = 10;
  repeated ModelTokenUsage tokens = 11;
  CostBreakdown cost = 12;
  // charges split cost into priced components (compute as vCPU and memory,
  // tokens per model and token type, storage). Their costs sum to
  // cost.total.
  repeated UsageCharge charges = 13;
}

// UsageCharge is one priced component of a DailyUsage, e.g. one FOCUS row.
message UsageCharge {
  // kind is "cpu", "memory", "tokens" or "storage".
  string kind = 1;
  // model is set for tokens.
  string model = 2;
  // token_type is set for tokens: "input" (uncached input), "cache_read",
  // "cache_write", "output" (excluding reasoning) or "reasoning". Following
  // the OTel GenAI conventions, ModelTokenUsage.input includes cache reads
  // and writes and output includes reasoning; the charge quantities do not
  // overlap.
  string token_type = 3;
  // quantity is the amount consumed, in unit ("vCPU-Hours", "GiB-Hours",
  // "Tokens" or "GiB-Months").
  double quantity = 4;
  string unit = 5;
  // pricing_quantity is quantity in pricing_unit ("1M Tokens" for tokens,
  // otherwise the same as unit).
  double pricing_quantity = 6;
  string pricing_unit = 7;
  // list_unit_price is the current rate card price per pricing_unit. It is
  // unset when the rate card has no price (no rate card, unknown model).
  optional double list_unit_price = 8;
  // cost is this component's share of the frozen day cost: cost.compute,
  // cost.tokens and cost.storage are split over their components in
  // proportion to their current list-price cost, which is exact unless the
  // rate card changed or a provider-reported cost was used.
  double cost = 9;
  // idle_cost is the part of cost consumed while idle (cpu and memory).
  double idle_cost = 10;
}

// Workspaces
message GetWorkspaceRequest {
  string atespace = 1;
  string name = 2;
}

message ListWorkspacesRequest {
  string atespace = 1;
}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message UpdateWorkspaceRequest {
  Workspace workspace = 1;
}

message DeleteWorkspaceRequest {
  string atespace = 1;
  string name = 2;
}

message DeleteWorkspaceResponse {}

// Models
message GetModelRequest {
  string atespace = 1;
  string name = 2;
}

message ListModelsRequest {
  string atespace = 1;
}

message ListModelsResponse {
  repeated Model models = 1;
}

message UpdateModelRequest {
  Model model = 1;
}

message DeleteModelRequest {
  string atespace = 1;
  string name = 2;
}

message DeleteModelResponse {}

