# Test rate card with round numbers so expected costs are easy to compute.
currency: USD
compute:
  default: { vcpuHour: 0.04, gibHour: 0.005 }
  pools:
    gpu: { vcpuHour: 0.10, gibHour: 0.01 }
    cheapcpu: { vcpuHour: 0.01 }      # gibHour falls back to default
storage:
  gibMonth: 0.03
models:
  m-basic: { input: 1.0, output: 4.0 }                  # cache/reasoning fall back
  m-full:  { input: 2.0, output: 8.0, cacheRead: 0.5, cacheWrite: 2.5, reasoning: 10.0 }
idle:
  cpuThreshold: 0.05
  after: 2m
budgets:
  defaultWarnAtPercent: 75
metricLabels: [agent, customer]
