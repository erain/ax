# Builds examples/finops-agent/Dockerfile from the repository root:
#
#   gcloud builds submit --project <project> --config examples/finops-agent/cloudbuild.yaml \
#     --substitutions _IMAGE=<region>-docker.pkg.dev/<project>/<repo>/ax-task-runner,_TAG=finops-$(git rev-parse --short HEAD) .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - -f
      - examples/finops-agent/Dockerfile
      - -t
      - ${_IMAGE}:${_TAG}
      - -t
      - ${_IMAGE}:finops-latest
      - .
images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:finops-latest
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/yiyu-gke-dev/ax-finops/ax-task-runner
  _TAG: finops-dev
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
