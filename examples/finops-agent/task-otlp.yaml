# A labeled AX Task running the FinOps Gemini harness, reporting token usage
# over OpenTelemetry spans to the runner's loopback OTLP receiver.
# Prerequisites (see README.md): the gemini-api-secret Secret in the atespace's
# namespace, and an egress policy for the actor (created after the task).
#
#   ax apply -f examples/finops-agent/task-otlp.yaml
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: finops-agent-otlp
  atespace: default
  labels:
    agent: finops-agent
    customer: acme
spec:
  image: "us-central1-docker.pkg.dev/yiyu-gke-dev/ax-finops/ax-task-runner:finops-latest"
  command: ["python3", "/opt/finops-agent/agent.py"]
  env:
    - {name: REPORT_MODE, value: "otlp"}
    - {name: MODEL, value: "gemini-3-flash-preview"}
    - {name: ITERATIONS, value: "3"}
    - {name: SLEEP_SECONDS, value: "10"}
    - {name: IDLE_SECONDS, value: "900"}
  budget:
    maxCost: {currency: USD, amount: 0.05}
    warnAtPercent: 80
    onExceeded: WARN
