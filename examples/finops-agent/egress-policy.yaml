# Agent Substrate v0.5.0 EgressPolicy letting a task's actor reach the Gemini
# API. Actors have no egress by default, and the policy is per actor (the
# actor name is the AX task name), so create one per task after the task
# exists. Deleting the task deletes the actor and, with it, this policy.
#
#   kubectl ate --context <ctx> create egress-policy <task-name> -a <atespace> \
#     -f examples/finops-agent/egress-policy.yaml
#
# tls_passthrough forwards TLS by SNI without decrypting it, so the sandbox
# validates Google's certificate with the image's public CA roots; no trust
# bundle is needed. The same rule also lets the sandbox DNS relay resolve the
# name.
rules:
  - tls_passthrough:
      hostnames: ["generativelanguage.googleapis.com"]
      ports: {numbers: [443]}
